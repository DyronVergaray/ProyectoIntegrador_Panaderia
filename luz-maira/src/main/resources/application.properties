spring.application.name=luz-maira
server.port=8080

# ===== SQL Server (se pueden cambiar con variables de entorno DB_URL, DB_USER, DB_PASS) =====
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PanaderiaLuzMayra;encrypt=true;trustServerCertificate=true}
spring.datasource.username=pan
spring.datasource.password=pan
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=5000

# ===== MongoDB (se usará más adelante para comentarios y encuestas) =====
spring.data.mongodb.uri=mongodb://localhost:27017/luzmayra

# Sin caché de archivos estáticos mientras se desarrolla
spring.web.resources.cache.period=0

# ===== Imágenes de productos =====
# Carpeta donde se guardan las fotos de productos (relativa a donde ejecutas la aplicación).
# Si publicas la app como .jar, cámbiala por una ruta absoluta (ej. C:/luzmayra/img/productos).
app.imagenes.carpeta=src/main/resources/static/img/productos
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# La sesión de inicio de sesión se cierra tras 2 horas sin actividad
server.servlet.session.timeout=2h

# ===== Registro de errores (Logback) =====
# Carpeta de los archivos de log (ver logback-spring.xml)
app.logs.carpeta=logs
